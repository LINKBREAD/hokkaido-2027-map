// ---------- 地图（升龙同款配置：Esri 默认 + fitBounds + 无多余图层）----------
const map = L.map('map', {zoomControl:true, tap:true, zoomSnap:.5,
  zoomAnimation:true, fadeAnimation:false, markerZoomAnimation:false, updateWhenZooming:false});
map.zoomControl.setPosition('bottomright');

const baseLayers = {
  'Esri 街道图（默认）': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:18, keepBuffer:4, updateWhenZooming:false, detectRetina:false, attribution:'© Esri, HERE, Garmin'}),
  'Esri 地形图': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:18, keepBuffer:4, updateWhenZooming:false, detectRetina:false, attribution:'© Esri, USGS'}),
  'CARTO 探索风': L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {subdomains:'abcd', maxZoom:19, keepBuffer:4, updateWhenZooming:false, detectRetina:false, attribution:'© CARTO'}),
  'OSM 全球标准': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {subdomains:'abc', maxZoom:19, keepBuffer:4, updateWhenZooming:false, detectRetina:false, attribution:'© OpenStreetMap'}),
  '高德（仅中国境内有内容）': L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {subdomains:['1','2','3','4'], maxZoom:18, keepBuffer:4, detectRetina:false, attribution:'© AutoNavi'}),
};
const BASE_ORDER = ['Esri 街道图（默认）','Esri 地形图','CARTO 探索风','OSM 全球标准','高德（仅中国境内有内容）'];
let baseIdx = 0;
baseLayers[BASE_ORDER[0]].addTo(map);
L.control.layers(baseLayers, null, {position:'bottomright', collapsed:true}).addTo(map);

// 出图看门狗：3.5 秒没图就换下一个源
let tileOk = 0, tries = 0, userPicked = false, probing = false, autoSwitching = false;
map.on('tileload', function(){
  if(++tileOk >= 2){ const t = document.getElementById('tip'); if(t) t.style.display='none'; }
});
function switchBase(){
  if(tries >= 2){ showWarn(); return; }
  probing = true; tries++;
  const cur = BASE_ORDER[baseIdx];
  baseIdx = (baseIdx + 1) % BASE_ORDER.length;
  autoSwitching = true;
  map.removeLayer(baseLayers[cur]);
  baseLayers[BASE_ORDER[baseIdx]].addTo(map);
  autoSwitching = false;
  tileOk = 0;
  setTimeout(function(){ probing = false; }, 5000);
}
const watchdog = setInterval(function(){
  if(userPicked || tileOk >= 2){ clearInterval(watchdog); return; }
  if(probing) return;
  switchBase();
}, 3500);
map.on('baselayerchange', function(){
  if(!autoSwitching){ userPicked = true; clearInterval(watchdog); }
  hideTip();
});
setTimeout(function(){
  // 以页面上实际渲染的瓦片数为准（缓存命中时 tileload 事件可能不触发）
  if(tileOk === 0 && document.querySelectorAll('.leaflet-tile-loaded').length === 0) showWarn();
}, 9000);
function showWarn(){
  const t = document.getElementById('tip');
  t.className = 'warn'; t.textContent = '底图加载不出来？点右下角 🗺 换一个底图试试';
  t.style.display = 'block';
}
function hideTip(){ const t = document.getElementById('tip'); t.style.display='none'; }

// ---------- 标记与路线 ----------
const POP_OPT = {maxWidth:250, minWidth:230, autoPanPadding:[26,26], closeButton:true};
const markers = {};
function iconHTML(s){
  return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14],
    html:`<div style="width:28px;height:28px;border-radius:50%;background:${CATS[s.cat].color};color:#fff;
      font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
      border:2px solid #fff;outline:1px solid rgba(15,23,42,.35)">${s.id}</div>`});
}
function popupHTML(s){
  const img = HAS_PHOTO.has(s.id)
    ? `<img class="pop-img" src="${THUMB_DIR + s.id}.jpg" data-full="${PHOTO_DIR + s.id}.jpg" alt="${s.name}">`
    : `<div class="pop-img-ph">${CATS[s.cat].icon}</div>`;
  return `<div>${img}<div class="pop-bd">
    <div class="pop-nm"><span class="pb" style="background:${CATS[s.cat].color}">${s.id}</span>${s.name}</div>
    <div class="row"><b>类型</b> ${s.type}　<b>门票</b> ${s.fee}</div>
    <div class="row"><b>地址</b> ${s.addr}</div>
    <div class="row"><b>时间</b> ${s.hours}</div>
    <div class="hist">${s.hist}</div>
    <div class="near">📍 ${s.near}</div>
    <button class="cp" data-coord="${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}">🧭 点这里复制坐标 ${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</button>
  </div></div>`;
}
function bindPop(m, s){
  m.on('click', function(){
    m.bindPopup(popupHTML(s), POP_OPT).openPopup();
    const pi = document.querySelector('.pop-img'); if(pi) pi.onclick = ()=>openLB(pi.dataset.full);
    const cp = document.querySelector('.cp'); if(cp) cp.onclick = ()=>copyCoord(cp);
  });
}
SPOTS.forEach(s=>{ const m = L.marker([s.lat,s.lng],{icon:iconHTML(s)}).addTo(map); bindPop(m, s); markers[s.id]=m; });

function line(ids, color, dash){
  const pts = ids.map(id=>{const s=SPOTS.find(x=>x.id===id); return [s.lat,s.lng];});
  L.polyline(pts,{color:color, weight:4, opacity:.85, dashArray:dash, lineJoin:'round'}).addTo(map);
}
line(TRIP_ROUTE, '#2563EB', null);
line(RETURN_ROUTE, '#94A3B8', '8,7');

// 视野只包北海道（大阪酒店偏远，从行程面板点开即可，免得把地图缩太小）
const hk = SPOTS.filter(s=>s.cat !== 'osaka');
map.fitBounds(L.latLngBounds(hk.map(s=>[s.lat,s.lng])).pad(0.10));

// ---------- 复制坐标 ----------
function copyCoord(el){
  const t = el.getAttribute('data-coord');
  const done = ()=>{ const o = el.dataset.t || el.textContent; el.textContent = '✅ 已复制 ' + t;
    setTimeout(()=>{ el.textContent = o; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fb); else fb();
  function fb(){
    const ta = document.createElement('textarea'); ta.value = t;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}

// ---------- 灯箱 ----------
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbLd = lb.querySelector('.ld');
function openLB(src){
  if(!src) return;
  lb.classList.add('show'); lbImg.style.display='none'; lbLd.style.display='block'; lbLd.textContent='大图加载中…';
  lbImg.onload = ()=>{ lbLd.style.display='none'; lbImg.style.display='block'; };
  lbImg.onerror = ()=>{ lbLd.textContent = '这张图暂时加载不出来'; };
  lbImg.src = src;
}
lb.onclick = ()=>{ lb.classList.remove('show'); lbImg.removeAttribute('src'); };

// ---------- 行程 / 分享 ----------
document.getElementById('itnList').innerHTML = ITINERARY.map(d=>
  `<div class="itn-day"><div class="dt">${d.d}</div>${d.items.map(it=>
    `<div class="it${it.spot?' spot':''}" ${it.spot?`data-spot="${it.spot}"`:''}>${it.icon} ${it.t}${it.spot?' →':''}</div>`).join('')}</div>`).join('');
document.querySelectorAll('.it.spot').forEach(el=>{
  el.onclick = ()=>{
    const s = SPOTS.find(x=>x.id === el.dataset.spot); if(!s) return;
    document.getElementById('itn').classList.remove('show');
    map.flyTo([s.lat,s.lng], 14, {duration:.8});
    setTimeout(()=>{ markers[s.id].openPopup(); }, 900);
  };
});
const itn = document.getElementById('itn'), sh = document.getElementById('sh');
document.getElementById('bI').onclick = ()=> itn.classList.add('show');
document.getElementById('itnClose').onclick = ()=> itn.classList.remove('show');
itn.onclick = e=>{ if(e.target === itn) itn.classList.remove('show'); };
document.getElementById('bS').onclick = ()=>{
  const q = document.getElementById('shQr');
  if(q.dataset.src){ q.src = q.dataset.src; q.removeAttribute('data-src'); }
  sh.classList.add('show');
};
document.getElementById('shClose').onclick = ()=> sh.classList.remove('show');
sh.onclick = e=>{ if(e.target === sh) sh.classList.remove('show'); };
</script>
</body>
</html>
